[package]
name = "eth-exporter"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
alloy = { version = "1", features = [
    "contract",
    "provider-http",
    "reqwest-rustls-tls",
], default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
futures = "0"
async-stream = "0.3.6"
figment = { version = "0.10.19", features = ["toml"] }
eth-prices = "0.0.4"
prometheus-client = "0.24.0"
poem = "3.1.12"
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
thiserror = "2"
