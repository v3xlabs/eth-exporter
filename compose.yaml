services:
  eth-exporter:
    image: ghcr.io/v3xlabs/eth-exporter:edge
    ports:
      - 3000:3000
    volumes:
      - ./config.toml:/config.toml
  prometheus:
    image: prom/prometheus
    # ports:
    #   - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    network_mode: host
  grafana:
    image: grafana/grafana
    ports:
      - 3001:3000
